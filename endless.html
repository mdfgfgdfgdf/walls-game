<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="חומות">
<title>חומות: העולם האינסופי</title>
<style>
html,body{margin:0;height:100%;background:#3f7a33;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;background:rgba(30,20,5,.6);color:#fff;border-radius:12px;padding:7px 11px;font-size:13px;font-weight:700;pointer-events:none;line-height:1.55}
#me{top:calc(10px + env(safe-area-inset-top));right:10px}
#mm{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:10px;border:3px solid rgba(30,20,5,.6);image-rendering:pixelated;pointer-events:none}
#dash{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:72px;height:72px;border-radius:50%;border:none;background:#f2b31b;color:#3b2500;font-size:30px;box-shadow:0 5px 0 #a36f00}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,30,10,.6);padding:16px}
.card{background:#fff6dc;color:#3b2a10;border-radius:22px;padding:22px;max-width:440px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.card h1{margin:0 0 6px;font-size:36px}.card p{font-size:16px;line-height:1.55;margin:6px 0}
button.go{font:inherit;font-size:21px;font-weight:800;padding:12px 30px;border:none;border-radius:14px;background:#e8a317;color:#3b2500;box-shadow:0 4px 0 #a36f00;margin-top:10px}
.hidden{display:none!important}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);color:#ffe066;font-size:30px;font-weight:900;text-shadow:0 3px 0 #000,0 0 12px rgba(0,0,0,.6);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;width:90%}
@media (hover:hover){#dash{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="mm" width="180" height="180" class="hidden"></canvas>
<div class="hud hidden" id="me"></div>
<button id="dash" class="hidden">💨</button>
<div id="toast"></div>
<div class="overlay" id="start"><div class="card">
  <h1>🌍 העולם האינסופי</h1>
  <p>עולם ענק מלא ממלכות, בלי סוף.<br>
  🏃 צא מהשטח וחזור, וכל מה שבפנים שלך.<br>
  👑 הקף טירה, והממלכה מצטרפת אליך ונלחמת בשבילך.<br>
  ⚠️ נגעו לך בגדר? חוזרים לטירה.<br>
  💪 ככל שהממלכה שלך גדלה, אתה מהיר וחזק יותר.</p>
  <p style="opacity:.7;font-size:14px">אצבע: גוררים לכיוון · מחשב: חיצים או עכבר · 💨 / רווח = דהירה</p>
  <button class="go" id="go">יאללה לכבוש ⚔️</button>
  <p><a href="./" style="color:#3b2a10">← למשחק הרגיל</a></p>
</div></div>
<script>
const W=180,H=180,N=W*H,WALLHP=4,SPEED=6.5;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let DPR=1,VW=0,VH=0,CP=20;
function fit(){DPR=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;VW=cv.width;VH=cv.height;CP=Math.max(16,Math.min(innerWidth,innerHeight)/20)*DPR}
addEventListener('resize',fit);fit();
const idx=(x,y)=>y*W+x,cx=c=>c%W,cy=c=>(c/W)|0,R=(a,b)=>a+Math.random()*(b-a);
const hsl=(p,l,a=1)=>`hsla(${p.hue},${p.sat}%,${l}%,${a})`;
const A=['ממלכת','שבט','מסדר','בית','אימפריית','נסיכות'],B=['הדרקון','הזאב','הנשר','היער','הברק','הלהבה','הסערה','הירח','השמש','ההר','הים','הקרח','האלון','העוגן','הכתר','הנחש','הדוב','השועל'];
let owner,trail,wall,capT,things=[],players=[],parts=[],texts=[],time=0,running=false,shake=0,counts=new Int32Array(128),cam={x:W/2,y:H/2};
const me=()=>players[0],foe=(a,b)=>a.team!==b.team;
let ac;function beep(f,d=.08,type='square',v=.04,delay=0){try{ac=ac||new AudioContext();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1600)}

// ---------- world ----------
function freeArea(x,y,r){if(x<r+1||y<r+1||x>=W-r-1||y>=H-r-1)return false;for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const c=idx(x+i,y+j);if(owner[c]||trail[c])return false}return true}
function newKingdom(x,y){if(players.length>=126)return null;const id=players.length+1;
  const p={id,team:id,name:A[(Math.random()*A.length)|0]+' '+B[(Math.random()*B.length)|0],hue:(id*47+R(0,30))%360,sat:R(55,80)|0,bot:true,x:x+.5,y:y+.5,dx:1,dy:0,tl:[],alive:true,respawn:0,dash:0,dashCd:0,brk:0,wp:[],bob:0,face:1,think:R(0,.4),hx:x,hy:y,skill:R(.85,1.3)};
  players.push(p);claimHome(p,2);things.push({x,y,kind:'home',homeOf:id,own:id,pop:0});return p}
function claimHome(p,r=1){for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const c=idx(p.hx+i,p.hy+j);owner[c]=p.team;wall[c]=Math.max(Math.abs(i),Math.abs(j))===r&&r>1?WALLHP:0}}
function init(){
  owner=new Int8Array(N);trail=new Int8Array(N);wall=new Int8Array(N);capT=new Float32Array(N).fill(-99);
  players=[];things=[];parts=[];texts=[];time=0;
  const m={id:1,team:1,name:'אני',hue:210,sat:80,bot:false,x:W/2+.5,y:H/2+.5,dx:1,dy:0,tl:[],alive:true,respawn:0,dash:0,dashCd:0,brk:0,wp:[],bob:0,face:1,hx:W/2,hy:H/2};
  players.push(m);claimHome(m,2);things.push({x:m.hx,y:m.hy,kind:'home',homeOf:1,own:1,pop:0});
  for(let gy=12;gy<H-8;gy+=21)for(let gx=12;gx<W-8;gx+=21){const x=gx+((R(-5,5))|0),y=gy+((R(-5,5))|0);if(Math.hypot(x-m.hx,y-m.hy)<14)continue;if(freeArea(x,y,4))newKingdom(x,y)}
  for(let k=0;k<4000&&things.length<players.length+260;k++){const x=4+((Math.random()*(W-8))|0),y=4+((Math.random()*(H-8))|0);if(owner[idx(x,y)])continue;if(things.every(t=>Math.abs(t.x-x)+Math.abs(t.y-y)>4))things.push({x,y,kind:'house',own:0,pop:0})}
  cam={x:m.x,y:m.y};
}
const near=(x,y,r=26)=>Math.abs(x-me().x)<r&&Math.abs(y-me().y)<r;

// ---------- growth: the bigger you are, the faster and safer ----------
const myLevel=()=>Math.min(10,1+Math.floor(counts[1]/400));
let lastLvl=1;

// ---------- input ----------
let keys={},kb=false,joy=null,mouse=null;
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{if(KM[e.code]){keys[KM[e.code]]=1;kb=true;e.preventDefault()}if(e.code==='Space'){dash(me());e.preventDefault()}});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=0});
cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')joy={x:e.clientX,y:e.clientY,dx:0,dy:0};else mouse=e});
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'&&joy){joy.dx=e.clientX-joy.x;joy.dy=e.clientY-joy.y;kb=false}else if(e.pointerType==='mouse'){mouse=e;kb=false}});
addEventListener('pointerup',()=>{});
document.getElementById('dash').addEventListener('pointerdown',e=>{e.stopPropagation();dash(me())});
function humanDir(p){
  if(kb){const x=(keys.r|0)-(keys.l|0),y=(keys.d|0)-(keys.u|0);if(x||y){const l=Math.hypot(x,y);p.dx=x/l;p.dy=y/l}return}
  if(joy&&Math.hypot(joy.dx,joy.dy)>8){const l=Math.hypot(joy.dx,joy.dy);p.dx=joy.dx/l;p.dy=joy.dy/l;return}
  if(mouse){const x=mouse.clientX-innerWidth/2,y=mouse.clientY-innerHeight/2,l=Math.hypot(x,y);if(l>20){p.dx=x/l;p.dy=y/l}}}
function dash(p){if(!p||!p.alive||p.dashCd>0||!running)return;p.dash=.35;p.dashCd=p.bot?3:Math.max(1.2,3-myLevel()*.18);if(!p.bot)beep(300,.15,'sawtooth',.03)}

// ---------- bots (only the ones near you play; far kingdoms wait) ----------
function nearestOwn(p){let best=null,bd=1e9;const x0=Math.max(0,(p.x-25)|0),x1=Math.min(W,(p.x+25)|0),y0=Math.max(0,(p.y-25)|0),y1=Math.min(H,(p.y+25)|0);
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const c=idx(x,y);if(owner[c]===p.team){const d=(x+.5-p.x)**2+(y+.5-p.y)**2;if(d<bd){bd=d;best=c}}}return best==null?idx(p.hx,p.hy):best}
const cl=(x,y)=>({x:Math.max(1.5,Math.min(W-1.5,x)),y:Math.max(1.5,Math.min(H-1.5,y))});
function loopAround(p,tx,ty,r,home){p.wp=[cl(tx-r,ty-r),cl(tx+r,ty-r),cl(tx+r,ty+r),cl(tx-r,ty+r),cl(tx-r,ty-r),home]}
function planLoop(p){const h=nearestOwn(p),home={x:cx(h)+.5,y:cy(h)+.5};
  if(p.team===1){// my allies push into the closest enemy kingdom
    const t=things.filter(t=>t.kind==='home'&&players[t.homeOf-1].team!==1&&Math.abs(t.x-p.x)+Math.abs(t.y-p.y)<40).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
    if(t&&Math.random()<.5){loopAround(p,t.x+.5,t.y+.5,3.5,home);return}}
  const tg=things.filter(t=>t.kind!=='home'&&t.own!==p.team&&Math.abs(t.x-p.x)+Math.abs(t.y-p.y)<16).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
  if(tg&&Math.random()<.5){loopAround(p,tg.x+.5,tg.y+.5,2,home);return}
  const d=[[1,0],[-1,0],[0,1],[0,-1]][(Math.random()*4)|0],s=Math.random()<.5?1:-1,q=[-d[1]*s,d[0]*s],L=R(4,10)*p.skill,Wd=R(3,7)*p.skill;
  p.wp=[cl(p.x+d[0]*L,p.y+d[1]*L),cl(p.x+d[0]*L+q[0]*Wd,p.y+d[1]*L+q[1]*Wd),cl(p.x+q[0]*Wd,p.y+q[1]*Wd),home]}
// smart bots: race math instead of random lunges
function homeDist(p){if(!p.tl.length)return 0;const h=nearestOwn(p);return Math.hypot(cx(h)+.5-p.x,cy(h)+.5-p.y)}
function botThink(p,dt){p.think-=dt;
  if(p.think<=0){p.think=.25;
    const myHome=homeDist(p);let danger=1e9,best=null,bestGain=0;
    for(const o of players){if(!foe(o,p)||!o.alive||Math.abs(o.x-p.x)>24||Math.abs(o.y-p.y)>24)continue;
      for(const c of p.tl){const d=Math.hypot(cx(c)+.5-o.x,cy(c)+.5-o.y);if(d<danger)danger=d}
      if(o.tl.length){const his=homeDist(o);for(let i=0;i<o.tl.length;i+=2){const c=o.tl[i],x=cx(c)+.5,y=cy(c)+.5,d=Math.hypot(x-p.x,y-p.y),margin=his-d*1.05;
        if(margin>.8&&d<20){const gain=o.tl.length+margin*2-d;if(gain>bestGain){bestGain=gain;best={x,y}}}}}}
    const h=nearestOwn(p),home={x:cx(h)+.5,y:cy(h)+.5},M=me();
    if(!best&&!p.tl.length&&p.team!==1&&M.alive&&M.tl.length&&Math.hypot(M.x-p.x,M.y-p.y)<22){const c=M.tl[M.tl.length>>1];best={x:cx(c)+.5,y:cy(c)+.5}}// stalk: move toward your fence, cut if you stay out too long
    if(p.tl.length&&danger<myHome+2)p.wp=[home];
    else if(best&&(!p.tl.length||danger>myHome+6))p.wp=[best];
    else if(p.tl.length>(14+Math.min(danger,30))*p.skill)p.wp=[home]}
  if(!p.wp.length)planLoop(p);const w=p.wp[0];if(!w)return;const x=w.x-p.x,y=w.y-p.y,l=Math.hypot(x,y);
  if(l<.5){p.wp.shift();return}p.dx+=(x/l-p.dx)*.3;p.dy+=(y/l-p.dy)*.3;const m=Math.hypot(p.dx,p.dy)||1;p.dx/=m;p.dy/=m}

// ---------- rules ----------
function enterCell(p,c){const t=trail[c];if(t&&foe(players[t-1],p))kill(players[t-1],p);
  if(owner[c]===p.team){if(p.tl.length)capture(p)}else if(!trail[c]){trail[c]=p.id;p.tl.push(c)}}
function capture(p){let gained=0,x0=W,y0=H,x1=0,y1=0;const blk=new Uint8Array(N);
  for(const c of p.tl){trail[c]=0;blk[c]=1;const x=cx(c),y=cy(c);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);if(owner[c]!==p.team)gained++;owner[c]=p.team;wall[c]=WALLHP;if(p.id===1)capT[c]=time}
  p.tl=[];
  // flood only inside the box around the loop and the kingdom it closes on
  for(let c=0;c<N;c++)if(owner[c]===p.team&&Math.abs(cx(c)-(x0+x1)/2)<60&&Math.abs(cy(c)-(y0+y1)/2)<60){const x=cx(c),y=cy(c);if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  x0=Math.max(0,x0-1);y0=Math.max(0,y0-1);x1=Math.min(W-1,x1+1);y1=Math.min(H-1,y1+1);
  const seen=new Uint8Array(N),st=[],push=c=>{if(!seen[c]&&owner[c]!==p.team&&!blk[c]){seen[c]=1;st.push(c)}};
  for(let x=x0;x<=x1;x++){push(idx(x,y0));push(idx(x,y1))}for(let y=y0;y<=y1;y++){push(idx(x0,y));push(idx(x1,y))}
  while(st.length){const c=st.pop(),x=cx(c),y=cy(c);if(x>x0)push(c-1);if(x<x1)push(c+1);if(y>y0)push(c-W);if(y<y1)push(c+W)}
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const c=idx(x,y);if(seen[c]||owner[c]===p.team||blk[c])continue;if(trail[c]&&foe(players[trail[c]-1],p))kill(players[trail[c]-1],p);owner[c]=p.team;wall[c]=0;gained++;if(p.id===1)capT[c]=time+Math.hypot(x-p.x,y-p.y)*.03}
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const c=idx(x,y);if(!wall[c])continue;const o=owner[c];if(x>0&&x<W-1&&y>0&&y<H-1&&owner[c-1]===o&&owner[c+1]===o&&owner[c-W]===o&&owner[c+W]===o)wall[c]=0}
  if(near(p.x,p.y)){texts.push({x:p.x,y:p.y-1,t:'+'+gained,life:1.2,col:hsl(p,40),big:gained>40});for(let i=0;i<20;i++)parts.push({x:p.x,y:p.y,vx:R(-7,7),vy:R(-9,-2),life:1,max:1,col:`hsl(${R(0,360)},90%,60%)`,s:R(2,4),g:14})}
  if(p.id===1){shake=Math.min(8,2+gained/20);[523,659,784,1046].forEach((f,i)=>beep(f,.12,'triangle',.05,i*.06))}}
function kill(v,k){if(!v.alive)return;v.alive=false;for(const c of v.tl)trail[c]=0;v.tl=[];
  if(v.team===v.id)for(let c=0;c<N;c++)if(owner[c]===v.team&&!(Math.abs(cx(c)-v.hx)<=1&&Math.abs(cy(c)-v.hy)<=1)){owner[c]=0;wall[c]=0}
  if(near(v.x,v.y))for(let i=0;i<24;i++)parts.push({x:v.x,y:v.y,vx:R(-9,9),vy:R(-10,3),life:1,max:1,col:i%2?hsl(v,55):'#ccc',s:R(2,5),g:16});
  v.respawn=v.id===1?2.5:3.5;if(v.id===1){shake=12;beep(140,.4,'sawtooth',.06);toast((k?k.name:'מישהו')+' הפיל אותך 💥')}}
function join(v,lord){const old=v.team;if(old===lord.team)return;if(v.id===1)return;
  for(const q of players)if(q.team===old){q.team=lord.team;q.hue=lord.hue;q.sat=lord.sat}
  for(let c=0;c<N;c++)if(owner[c]===old){owner[c]=lord.team;if(lord.id===1)capT[c]=time+Math.hypot(cx(c)-v.hx,cy(c)-v.hy)*.03}
  claimHome(v);if(lord.id===1){shake=12;toast('👑 '+v.name+' הצטרפה אליך!');[523,659,784,1046,1318].forEach((f,i)=>beep(f,.15,'triangle',.06,i*.07))}}

// ---------- endless: new kingdoms keep rising around you ----------
let spawnT=0;
function spawnAround(){const m=me();let foes=0;for(const t of things)if(t.kind==='home'&&players[t.homeOf-1].team!==1&&Math.abs(t.x-m.x)<45&&Math.abs(t.y-m.y)<45)foes++;
  if(foes>=7)return;for(let k=0;k<60;k++){const a=R(0,7),d=R(26,42),x=(m.x+Math.cos(a)*d)|0,y=(m.y+Math.sin(a)*d)|0;if(freeArea(x,y,3)){const p=newKingdom(x,y);if(p){toast('⚔️ ממלכה חדשה קמה: '+p.name)}return}}}

// ---------- update ----------
let cntT=0;
function update(dt){time+=dt;
  cntT-=dt;if(cntT<=0){cntT=.5;counts.fill(0);for(let c=0;c<N;c++)if(owner[c])counts[owner[c]]++;const L=myLevel();if(L>lastLvl){lastLvl=L;toast('💪 רמה '+L+': אתה מהיר וחזק יותר!');beep(880,.2,'triangle',.06)}}
  spawnT-=dt;if(spawnT<=0){spawnT=4;spawnAround()}
  const m=me();
  for(const p of players){
    if(p.bot&&!near(p.x,p.y,45))continue;
    if(!p.alive){p.respawn-=dt;if(p.respawn<=0){claimHome(p);p.x=p.hx+.5;p.y=p.hy+.5;p.alive=true;p.tl=[];p.wp=[]}continue}
    if(p.bot)botThink(p,dt);else humanDir(p);
    p.dashCd-=dt;p.dash-=dt;if(Math.abs(p.dx)>.2)p.face=p.dx>0?1:-1;
    const sp=SPEED*(p.dash>0?2.2:1)*(p.id===1?1+Math.min(.5,(myLevel()-1)*.06):1);
    const nx=Math.max(.5,Math.min(W-.5,p.x+p.dx*sp*dt)),ny=Math.max(.5,Math.min(H-.5,p.y+p.dy*sp*dt));
    const cc=idx(p.x|0,p.y|0),nc=idx(nx|0,ny|0);
    if(nc!==cc&&wall[nc]>0&&owner[nc]!==p.team){p.brk+=dt;p.bob+=dt*40;const need=p.id===1?Math.max(.15,.42-myLevel()*.03):.42;
      if(p.brk>need){p.brk=0;wall[nc]--;if(near(p.x,p.y))for(let i=0;i<5;i++)parts.push({x:cx(nc)+.5,y:cy(nc)+.5,vx:R(-4,4),vy:R(-6,-1),life:.5,max:.5,col:'#9aa0a8',s:R(2,4),g:18});if(p.id===1){shake=Math.max(shake,3);beep(180,.06,'square',.05)}}continue}
    p.brk=0;p.x=nx;p.y=ny;p.bob+=dt*sp*2.6;if(nc!==cc)enterCell(p,nc)}
  for(const t of things){const o=owner[idx(t.x,t.y)];
    if(t.kind==='home'){const v=players[t.homeOf-1];if(o&&o!==v.team&&v.id!==1)join(v,players[o-1]);t.own=v.team;continue}
    if(o!==t.own){t.own=o;t.pop=1;if(o===1&&near(t.x,t.y))beep(784,.1,'triangle',.04)}}}
function fx(dt){shake=Math.max(0,shake-dt*30);for(const q of parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt}parts=parts.filter(q=>q.life>0);
  for(const t of texts){t.life-=dt;t.y-=dt*1.4}texts=texts.filter(t=>t.life>0);for(const t of things)t.pop=Math.max(0,t.pop-dt*2.5)}

// ---------- draw: only what's on screen ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){const m=me(),tx=m.alive?m.x:m.hx+.5,ty=m.alive?m.y:m.hy+.5;cam.x+=(tx-cam.x)*.12;cam.y+=(ty-cam.y)*.12;
  const S=CP,hw=VW/2/S,hh=VH/2/S,k=S/16;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#2f5f28';ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(k,0,0,k,VW/2-cam.x*S+(shake?R(-shake,shake):0),VH/2-cam.y*S+(shake?R(-shake,shake):0));
  const x0=Math.max(0,Math.floor(cam.x-hw)-1),x1=Math.min(W,Math.ceil(cam.x+hw)+1),y0=Math.max(0,Math.floor(cam.y-hh)-1),y1=Math.min(H,Math.ceil(cam.y+hh)+2),CS=16;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const c=idx(x,y),o=owner[c];ctx.fillStyle=o?hsl(players[o-1],70,.95):(x+y)%2?'#86c95f':'#7fc258';ctx.fillRect(x*CS,y*CS,CS+.5,CS+.5);
    const f=time-capT[c];if(f>-2&&f<.6){ctx.fillStyle=f<0?'rgba(126,196,90,.9)':`rgba(255,255,220,${(1-f/.6)*.75})`;ctx.fillRect(x*CS,y*CS,CS,CS)}}
  ctx.lineWidth=2;for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const c=idx(x,y),o=owner[c];if(!o)continue;const X=x*CS,Y=y*CS;ctx.strokeStyle=hsl(players[o-1],40,.9);ctx.beginPath();
    if(y>0&&owner[c-W]!==o){ctx.moveTo(X,Y);ctx.lineTo(X+CS,Y)}if(y<H-1&&owner[c+W]!==o){ctx.moveTo(X,Y+CS);ctx.lineTo(X+CS,Y+CS)}if(x>0&&owner[c-1]!==o){ctx.moveTo(X,Y);ctx.lineTo(X,Y+CS)}if(x<W-1&&owner[c+1]!==o){ctx.moveTo(X+CS,Y);ctx.lineTo(X+CS,Y+CS)}ctx.stroke()}
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const c=idx(x,y);if(!wall[c]||!owner[c])continue;const p=players[owner[c]-1],X=x*CS,Y=y*CS;ctx.fillStyle='rgba(0,0,0,.25)';rr(X+1,Y+3,CS-2,CS-2,4);ctx.fill();ctx.fillStyle='#8f949c';rr(X+1,Y+1,CS-2,CS-3,4);ctx.fill();ctx.fillStyle='#b6bbc3';rr(X+2,Y+2,CS-4,6,3);ctx.fill();ctx.fillStyle=hsl(p,50);ctx.fillRect(X+3,Y+CS-6,CS-6,3)}
  const inV=(x,y)=>x>x0-3&&x<x1+3&&y>y0-3&&y<y1+3;
  for(const p of players)p.tl.forEach((c,i)=>{const x=cx(c),y=cy(c);if(!inV(x,y))return;const X=x*CS+8,Y=y*CS+8,w=Math.sin(time*12+i);ctx.fillStyle=hsl(p,60,.35);ctx.fillRect(x*CS,y*CS,CS,CS);ctx.fillStyle='#8a5a2b';rr(X-2+w*.3,Y-6,4,12,1.5);ctx.fill();ctx.fillStyle=hsl(p,55);ctx.beginPath();ctx.moveTo(X-3,Y-6);ctx.lineTo(X,Y-10);ctx.lineTo(X+3,Y-6);ctx.fill()});
  for(const t of things){if(!inV(t.x,t.y))continue;const X=t.x*CS+8,Y=t.y*CS+8,home=t.kind==='home',s=(home?1.5:1)*(1+t.pop*.5),p=t.own?players[t.own-1]:null;ctx.save();ctx.translate(X,Y);ctx.scale(s,s);ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(0,9,10,3,0,0,7);ctx.fill();
    if(home){ctx.fillStyle='#efe4c8';ctx.fillRect(-9,-4,18,13);ctx.fillRect(-11,-9,6,18);ctx.fillRect(5,-9,6,18);ctx.fillStyle=p?hsl(p,45):'#777';ctx.beginPath();ctx.moveTo(-12,-9);ctx.lineTo(-8,-15);ctx.lineTo(-4,-9);ctx.moveTo(4,-9);ctx.lineTo(8,-15);ctx.lineTo(12,-9);ctx.moveTo(-3,-9);ctx.lineTo(0,-18);ctx.lineTo(3,-9);ctx.fill();ctx.fillStyle='#5b4632';rr(-3,2,6,7,3);ctx.fill()}
    else{ctx.fillStyle='#f3e6c8';ctx.fillRect(-6,-2,12,10);ctx.fillStyle=p?hsl(p,48):'#a0522d';ctx.beginPath();ctx.moveTo(-8,-1);ctx.lineTo(0,-9);ctx.lineTo(8,-1);ctx.fill();ctx.fillStyle='#6b4a2b';ctx.fillRect(-2,3,4,5)}ctx.restore()}
  for(const p of players){if(!p.alive||!inV(p.x,p.y))continue;const X=p.x*CS,Y=p.y*CS,b=Math.sin(p.bob),hop=Math.abs(b)*3;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(X,Y+8,8,3,0,0,7);ctx.fill();ctx.save();ctx.translate(X,Y-hop);ctx.scale(p.face,1);
    ctx.fillStyle='#555';ctx.fillRect(-4,5+b*2,3,5);ctx.fillRect(1,5-b*2,3,5);ctx.fillStyle=hsl(p,52);ctx.beginPath();ctx.arc(0,1,8,0,7);ctx.fill();ctx.fillStyle='#c8ccd3';ctx.beginPath();ctx.arc(0,-6,7,Math.PI,0);ctx.lineTo(7,-3);ctx.lineTo(-7,-3);ctx.fill();ctx.fillStyle='#2b2d33';ctx.fillRect(1,-6,6,2);ctx.fillStyle=hsl(p,55);ctx.beginPath();ctx.ellipse(-3,-14,5,2.5,-.5,0,7);ctx.fill();
    ctx.save();ctx.translate(7,1);ctx.rotate(p.brk>0?-1.4+((time*6)%1)*2:.3+b*.3);ctx.fillStyle='#e5e8ee';ctx.fillRect(0,-12,2.5,12);ctx.restore();ctx.restore();
    if(p.id===1){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(X,Y,13+Math.sin(time*5)*1.5,0,7);ctx.stroke()}}
  for(const q of parts){if(!inV(q.x,q.y))continue;ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.col;ctx.fillRect(q.x*CS,q.y*CS,q.s,q.s)}ctx.globalAlpha=1;
  for(const t of texts){if(!inV(t.x,t.y))continue;ctx.globalAlpha=Math.min(1,t.life*2);ctx.font=`900 ${t.big?24:17}px system-ui`;ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(t.t,t.x*CS,t.y*CS);ctx.fillStyle=t.col;ctx.fillText(t.t,t.x*CS,t.y*CS)}ctx.globalAlpha=1}

// ---------- hud + minimap ----------
const mm=document.getElementById('mm'),mx=mm.getContext('2d'),mimg=mx.createImageData(W,H);let hudT=0,mmT=0;
function hslRgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return[f(0)*255|0,f(8)*255|0,f(4)*255|0]}
function hud(dt){hudT-=dt;if(hudT<=0){hudT=.3;const m=me(),mine=players.filter(p=>p.team===1&&p.id!==1).length,foes=players.filter(p=>p.team===p.id&&p.id!==1).length;
  document.getElementById('me').innerHTML=`💪 רמה ${myLevel()}<br>🗺️ ${(counts[1]/N*100).toFixed(1)}% מהעולם<br>👑 ממלכות שלך: ${mine}<br>⚔️ ממלכות אויב: ${foes}`}
  mmT-=dt;if(mmT<=0){mmT=1;const rgb=players.map(p=>hslRgb(p.hue,p.sat,50)),d=mimg.data;for(let c=0;c<N;c++){const o=owner[c],i=c*4,col=o?rgb[o-1]:[110,170,80];d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255}mx.putImageData(mimg,0,0);const m=me();mx.fillStyle='#fff';mx.fillRect(m.x-2,m.y-2,5,5)}}

function go(){try{ac=ac||new AudioContext();ac.resume()}catch(e){}init();document.getElementById('start').classList.add('hidden');['me','mm','dash'].forEach(i=>document.getElementById(i).classList.remove('hidden'));running=true;lastLvl=1;spawnT=0}
document.getElementById('go').onclick=go;
init();let last=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;try{if(running)update(dt);fx(dt);draw();if(running)hud(dt)}catch(e){console.error(e)}}
requestAnimationFrame(loop);
</script>
</body>
