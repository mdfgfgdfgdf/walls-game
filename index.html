<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="חומות">
<title>חומות</title>
<style>
html,body{margin:0;height:100%;background:#3f7a33;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}
canvas{display:block;margin:0 auto;touch-action:none;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.35)}
.panel{position:fixed;top:10px;background:rgba(30,20,5,.55);color:#fff;padding:8px 12px;border-radius:12px;font-size:14px;min-width:160px;pointer-events:none;line-height:1.6}
@media (max-width:700px),(orientation:portrait){#lb{display:none}#me{font-size:12px!important;min-width:0;padding:6px 9px}#timer{font-size:15px;padding:4px 12px}.card{padding:18px 16px!important;max-height:88vh;overflow:auto}.card h1{font-size:34px!important}.card p{font-size:15px!important}html,body{overscroll-behavior:none;touch-action:none}}
#lb{left:10px}#me{right:10px;font-size:16px;font-weight:700}
#timer{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(30,20,5,.55);color:#fff;padding:6px 18px;border-radius:20px;font-size:20px;font-weight:800;pointer-events:none}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,30,10,.55)}
.card{background:#fff6dc;border-radius:22px;padding:26px 34px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4);max-width:88vw;color:#3b2a10;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.card h1{margin:0 0 8px;font-size:44px}.card p{font-size:18px;line-height:1.6;margin:8px 0}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
button{font:inherit;font-size:20px;font-weight:700;padding:12px 28px;border:none;border-radius:14px;background:#e8a317;color:#3b2500;cursor:pointer;box-shadow:0 4px 0 #a36f00;margin:6px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a36f00}
button.alt{background:#4fb35a;color:#fff;box-shadow:0 4px 0 #2a7a33}
.hidden{display:none}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .3s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel hidden" id="lb"></div>
<div id="timer" class="hidden"></div>
<div class="panel hidden" id="me"></div>

<div class="overlay" id="start"><div class="card">
  <h1>🏰 חומות</h1>
  <p>🏃 צא מהשטח שלך, ומאחוריך נבנית גדר.<br>
  🏠 חזור הביתה, והכל בפנים נכבש. הגדר הופכת לחומת אבן!<br>
  ⚠️ אם מישהו נוגע לך בגדר, נפלת.<br>
  🔨 חומה של אויב? רוץ לתוכה ותשבור אותה.<br>
  👑 הקף טירה של אויב, והממלכה שלו מצטרפת אליך!</p>
  <p style="opacity:.75">עכבר / אצבע / חיצים לתנועה · רווח = דהירה</p>
  <p id="lvlInfo" style="background:#3b2a10;color:#fff;border-radius:12px;padding:8px 12px"></p>
  <button id="go">יאללה לכבוש! ⚔️</button>
  <button class="alt" id="insane" style="background:#2a0a0a;color:#ff4d4d;box-shadow:0 4px 0 #000">😱 צלם מהלך מטורף (סרטון לטיקטוק)</button>
  <button class="alt" id="film">🎬 מצב צילום (המשחק משחק לבד ומצלם רגעים)</button>
</div></div>

<div class="overlay hidden" id="dead"><div class="card">
  <h1>💥</h1>
  <p id="deadTxt" style="font-size:22px;font-weight:800"></p>
  <p>חוזר לטירה שלך בעוד רגע...</p>
  <button class="alt" id="revenge">📲 קרא לחבר לנקום</button>
</div></div>

<div class="overlay hidden" id="end"><div class="card">
  <h1 id="endTitle">👑</h1>
  <p id="endTxt" style="font-size:22px;font-weight:800"></p>
  <div id="clips" style="margin:10px 0"></div>
  <button id="again">עוד משחק!</button>
  <button class="alt" id="share">📲 שתף</button>
</div></div>
<div id="toast"></div>

<script>
const W=64,H=44,CS=16,N=W*H,WALLHP=4,SPEED=6.5,ROUND=300;
const SS=new URLSearchParams(location.search).has('hq')?3:1;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W*CS*SS;cv.height=H*CS*SS;
let mobileCam=false,camS=1;
function fit(){if(innerHeight>innerWidth*1.1){mobileCam=true;camS=innerHeight/cv.height;cv.style.width=cv.width*camS+'px';cv.style.height=innerHeight+'px';cv.style.marginTop='0';cv.style.borderRadius='0';cv.style.position='fixed';cv.style.top='0';cv.style.left='0';return}mobileCam=false;cv.style.position='';cv.style.transform='';const s=Math.min((innerWidth-16)/cv.width,(innerHeight-16)/cv.height);cv.style.width=cv.width*s+'px';cv.style.height=cv.height*s+'px';cv.style.marginTop=(innerHeight-cv.height*s)/2+'px'}
addEventListener('resize',fit);fit();
let camX=0;function followCam(){if(!mobileCam||!players.length)return;const m=me(),px=(m.alive?m.x:m.hx+.5)*CS*SS*camS,target=Math.max(innerWidth-cv.width*camS,Math.min(0,innerWidth/2-px));camX+=(target-camX)*.15;cv.style.transform=`translateX(${camX}px)`}

const CFG=[['אתה',210,80],['סר דני',2,75],['ליידי נועה',130,55],['אביר משה',40,95],['סר יוסי',285,60],['גברת מאיה',175,70]];
const HOMES=[[6,6],[W-7,H-7],[W-7,6],[6,H-7],[W>>1,5],[W>>1,H-6]];
let capT=new Float32Array(64*44).fill(-99);
let owner,trail,wall,things,players=[],parts=[],texts=[],shake=0,time=0,left=ROUND,running=false;
const idx=(x,y)=>y*W+x, cx=c=>c%W, cy=c=>(c/W)|0;
const R=(a,b)=>a+Math.random()*(b-a);
const hsl=(p,l,a=1)=>`hsla(${p.hue},${p.sat}%,${l}%,${a})`;
const me=()=>players[0];
const foe=(a,b)=>a.team!==b.team;
const lords=()=>players.filter(p=>!p.out&&p.team===p.id);

// ---------- sound ----------
let ac;
function beep(f,d=.08,type='square',v=.04,delay=0){try{ac=ac||new AudioContext();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}

// ---------- background ----------
const bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;
(function(){const b=bg.getContext('2d');b.scale(SS,SS);for(let y=0;y<H;y++)for(let x=0;x<W;x++){b.fillStyle=(x+y)%2?'#86c95f':'#7fc258';b.fillRect(x*CS,y*CS,CS,CS)}
for(let i=0;i<500;i++){const x=R(0,bg.width),y=R(0,bg.height);b.strokeStyle='rgba(40,110,30,.45)';b.lineWidth=1.3;b.beginPath();b.moveTo(x,y);b.lineTo(x-2,y-4);b.moveTo(x,y);b.lineTo(x+2,y-4);b.stroke()}
for(let i=0;i<40;i++){const x=R(0,bg.width),y=R(0,bg.height);b.fillStyle=['#fff','#ffd84a','#ff8fb0'][i%3];b.beginPath();b.arc(x,y,2,0,7);b.fill()}})();

// ---------- setup ----------
function claimHome(p){for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const c=idx(p.hx+i,p.hy+j);owner[c]=p.team;wall[c]=0}}
const LEVELS=[{bots:2,goal:25,t:180,name:'הכפר'},{bots:3,goal:35,t:180,name:'העיר'},{bots:4,goal:45,t:240,name:'המחוז'},{bots:5,goal:55,t:240,name:'הממלכה'},{bots:5,goal:70,t:300,name:'העולם'}];
let lvl=0;try{lvl=Math.min(LEVELS.length-1,+localStorage.getItem('walls_lvl')||0)}catch(e){}
const L=()=>LEVELS[lvl];let goalT=0;
function showLevel(){const el=document.getElementById('lvlInfo');if(el)el.innerHTML=`<b>שלב ${lvl+1} מתוך ${LEVELS.length}: ${L().name}</b><br>כבוש ${L().goal}% מהמפה, מול ${L().bots} אבירים`}
function init(){
  owner=new Int8Array(N);trail=new Int8Array(N);wall=new Int8Array(N);capT=new Float32Array(N).fill(-99);
  things=[];
  const homes=[...HOMES].sort(()=>Math.random()-.5);
  players=CFG.map((c,i)=>({id:i+1,team:i+1,name:c[0],hue:c[1],sat:c[2],bot:i>0,x:0,y:0,dx:1,dy:0,tl:[],alive:true,out:false,respawn:0,dash:0,dashCd:0,brk:0,wp:[],bob:0,face:1,think:0,hx:homes[i][0],hy:homes[i][1]}));
  for(const p of players){things.push({x:p.hx,y:p.hy,kind:'home',homeOf:p.id,own:p.team,pop:0});claimHome(p);p.x=p.hx+.5;p.y=p.hy+.5}
  things.push({x:W>>1,y:H>>1,big:true,own:0,pop:0});
  for(let t=0;t<2000&&things.length<20;t++){const x=3+((Math.random()*(W-6))|0),y=3+((Math.random()*(H-6))|0);if(things.every(o=>Math.hypot(o.x-x,o.y-y)>6))things.push({x,y,big:false,own:0,pop:0})}
  for(let k=L().bots+1;k<players.length;k++){const p=players[k];p.out=true;p.alive=false;for(let c=0;c<N;c++)if(owner[c]===p.team){owner[c]=0;wall[c]=0}}
  parts=[];texts=[];left=songMode?ROUND:L().t;goalT=0;
}
function respawn(p){
  claimHome(p);
  p.x=p.hx+.5;p.y=p.hy+.5;p.alive=true;p.tl=[];p.wp=[];p.dash=0;p.brk=0;
  for(let i=0;i<14;i++)parts.push({x:p.x,y:p.y,vx:R(-4,4),vy:R(-4,4),life:.6,max:.6,col:hsl(p,60),s:R(2,4),g:0});
  if(!p.bot)document.getElementById('dead').classList.add('hidden');
}

// ---------- input ----------
let mouse=null,keys={},kb=false;
let touchO=null;
cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')touchO={x:e.clientX,y:e.clientY}});addEventListener('pointerup',()=>{touchO=null});
function setMouse(e){if(e.pointerType!=='mouse'&&touchO&&players.length){const dx=e.clientX-touchO.x,dy=e.clientY-touchO.y;if(Math.hypot(dx,dy)>8){const m=me(),l=Math.hypot(dx,dy);mouse={x:m.x+dx/l*20,y:m.y+dy/l*20};kb=false}return}const r=cv.getBoundingClientRect();mouse={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};kb=false}
cv.addEventListener('pointermove',setMouse);
cv.addEventListener('pointerdown',setMouse);
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{if(KM[e.code]){keys[KM[e.code]]=1;kb=true;e.preventDefault()}if(e.code==='Space'){doDash(me());e.preventDefault()}if(e.code==='Enter'&&!running&&!document.getElementById('start').classList.contains('hidden'))start()});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=0});
cv.addEventListener('dblclick',()=>doDash(me()));
function humanDir(p){
  if(kb){const x=(keys.r|0)-(keys.l|0),y=(keys.d|0)-(keys.u|0);if(x||y){const l=Math.hypot(x,y);p.dx=x/l;p.dy=y/l}}
  else if(mouse){const x=mouse.x-p.x,y=mouse.y-p.y,l=Math.hypot(x,y);if(l>.35){p.dx=x/l;p.dy=y/l}}
}
function doDash(p){if(!p||!p.alive||p.dashCd>0||!running)return;p.dash=.35;p.dashCd=3;if(!p.bot)beep(300,.15,'sawtooth',.03);
  for(let i=0;i<10;i++)parts.push({x:p.x,y:p.y,vx:-p.dx*R(3,7)+R(-2,2),vy:-p.dy*R(3,7)+R(-2,2),life:.4,max:.4,col:'rgba(255,255,255,.8)',s:R(2,4),g:0})}

// ---------- bots ----------
function nearestOwn(p){let best=null,bd=1e9;for(let c=0;c<N;c++)if(owner[c]===p.team){const d=(cx(c)+.5-p.x)**2+(cy(c)+.5-p.y)**2;if(d<bd){bd=d;best=c}}return best}
const clampPt=(x,y)=>({x:Math.max(1.5,Math.min(W-1.5,x)),y:Math.max(1.5,Math.min(H-1.5,y))});
function loopAround(p,tx,ty,r,home){if(window.__bold&&p.id===1)r=r*(2+Math.random()*2.5);p.wp=[clampPt(tx-r,ty-r),clampPt(tx+r,ty-r),clampPt(tx+r,ty+r),clampPt(tx-r,ty+r),clampPt(tx-r,ty-r),home]}
function planLoop(p){
  const h=nearestOwn(p);if(h==null)return;
  const home={x:cx(h)+.5,y:cy(h)+.5};
  if(time>40&&Math.random()<.2){const t=things.filter(t=>t.kind==='home'&&!players[t.homeOf-1].out&&players[t.homeOf-1].team!==p.team&&(players[t.homeOf-1].bot||time>70)).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
    if(t&&Math.hypot(t.x-p.x,t.y-p.y)<20){loopAround(p,t.x+.5,t.y+.5,3,home);return}}
  const target=things.filter(t=>t.kind!=='home'&&t.own!==p.team).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
  if(target&&Math.random()<.45&&Math.hypot(target.x-p.x,target.y-p.y)<14){loopAround(p,target.x+.5,target.y+.5,target.big?3:2,home);return}
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]],d=dirs[(Math.random()*4)|0],s=Math.random()<.5?1:-1,q=[-d[1]*s,d[0]*s];
  const L=R(4,11),Wd=R(3,8);
  p.wp=[clampPt(p.x+d[0]*L,p.y+d[1]*L),clampPt(p.x+d[0]*L+q[0]*Wd,p.y+d[1]*L+q[1]*Wd),clampPt(p.x+q[0]*Wd,p.y+q[1]*Wd),home];
}
function botThink(p,dt){
  if(p.scripted){const w=p.wp[0];if(!w)return;const x=w.x-p.x,y=w.y-p.y,l=Math.hypot(x,y);if(l<.4){p.wp.shift();return}p.dx=x/l;p.dy=y/l;return}
  p.think-=dt;
  if(p.think<=0){p.think=.3;
    for(const o of players){if(!foe(o,p)||!o.alive||!o.tl.length)continue;
      for(const c of o.tl){const d=Math.hypot(cx(c)+.5-p.x,cy(c)+.5-p.y);if(d<5&&Math.random()<.35){p.wp=[{x:cx(c)+.5,y:cy(c)+.5}];break}}}
    if(p.tl.length>34){const h=nearestOwn(p);if(h!=null)p.wp=[{x:cx(h)+.5,y:cy(h)+.5}]}
  }
  if(!p.wp.length)planLoop(p);
  const w=p.wp[0];if(!w)return;
  const x=w.x-p.x,y=w.y-p.y,l=Math.hypot(x,y);
  if(l<.5){p.wp.shift();return}
  p.dx+=(x/l-p.dx)*.3;p.dy+=(y/l-p.dy)*.3;const m=Math.hypot(p.dx,p.dy)||1;p.dx/=m;p.dy/=m;
  if(p.tl.length>12&&Math.random()<dt*.3)doDash(p);
}

// ---------- rules ----------
function enterCell(p,c){
  const t=trail[c];
  if(t&&foe(players[t-1],p))kill(players[t-1],p);
  if(owner[c]===p.team){if(p.tl.length)capture(p)}
  else if(!trail[c]){trail[c]=p.id;p.tl.push(c)}
}
function capture(p){
  const chased=p.id===1&&players.some(q=>foe(q,p)&&q.alive&&Math.hypot(q.x-p.x,q.y-p.y)<(autoFilm?6:3.5));
  let gained=0,sx=0,sy=0;
  for(const c of p.tl){trail[c]=0;if(owner[c]!==p.team)gained++;owner[c]=p.team;wall[c]=WALLHP;sx+=cx(c);sy+=cy(c)}
  const n0=p.tl.length;p.tl=[];
  const seen=new Uint8Array(N),st=[];
  const push=c=>{if(!seen[c]&&owner[c]!==p.team){seen[c]=1;st.push(c)}};
  for(let x=0;x<W;x++){push(idx(x,0));push(idx(x,H-1))}
  for(let y=0;y<H;y++){push(idx(0,y));push(idx(W-1,y))}
  while(st.length){const c=st.pop(),x=cx(c),y=cy(c);if(x>0)push(c-1);if(x<W-1)push(c+1);if(y>0)push(c-W);if(y<H-1)push(c+W)}
  const fx=[];
  for(let c=0;c<N;c++)if(!seen[c]&&owner[c]!==p.team){
    if(trail[c]&&foe(players[trail[c]-1],p))kill(players[trail[c]-1],p);
    owner[c]=p.team;wall[c]=0;gained++;if(Math.random()<.25)fx.push(c);if(p.id===1)capT[c]=time+Math.hypot(cx(c)-p.x,cy(c)-p.y)*.03;
  }
  // walls stay only on a kingdom's outer edge
  for(let c=0;c<N;c++){if(!wall[c])continue;const o=owner[c],x=cx(c),y=cy(c);if(!o){wall[c]=0;continue}
    if((x===0||owner[c-1]===o)&&(x===W-1||owner[c+1]===o)&&(y===0||owner[c-W]===o)&&(y===H-1||owner[c+W]===o))wall[c]=0}
  const mx=n0?sx/n0+.5:p.x,my=n0?sy/n0+.5:p.y;
  for(const c of fx.slice(0,60))parts.push({x:cx(c)+.5,y:cy(c)+.5,vx:R(-2,2),vy:R(-5,-1),life:.8,max:.8,col:hsl(p,R(55,75)),s:R(2,5),g:6});
  for(let i=0;i<24;i++)parts.push({x:mx,y:my,vx:R(-7,7),vy:R(-9,-2),life:1,max:1,col:`hsl(${R(0,360)},90%,60%)`,s:R(2,4),g:14,conf:1});
  texts.push({x:mx,y:my,t:'+'+gained,life:1.2,col:hsl(p,40),big:gained>40});
  if(p.id===1){window.__lastGain=gained;if(chased&&n0>4)highlight('escape');else if(gained>=(autoFilm?35:80))highlight('bigloop')}
  if(p.team===1){shake=Math.min(10,3+gained/15);[523,659,784,1046].forEach((f,i)=>beep(f,.12,'triangle',.05,i*.06))}
}
function kill(v,k){
  if(!v.alive)return;
  window.__lastTrail=v.tl.length;
  if(v.id===1&&v.tl.length>=10)highlight('fail');else if(k&&k.id===1&&v.tl.length>=10)highlight('hunt');
  v.alive=false;
  for(const c of v.tl)trail[c]=0;v.tl=[];
  // a kingdom's leader falling wipes its land (castles stay); an ally falling only loses its fence
  if(v.team===v.id)for(let c=0;c<N;c++)if(owner[c]===v.team){const keep=players.some(q=>q.team===v.team&&!q.out&&Math.abs(cx(c)-q.hx)<=1&&Math.abs(cy(c)-q.hy)<=1);if(!keep){owner[c]=0;wall[c]=0}}
  for(let i=0;i<30;i++)parts.push({x:v.x,y:v.y,vx:R(-9,9),vy:R(-10,3),life:1,max:1,col:i%2?hsl(v,55):'#c9ced6',s:R(2,5),g:16});
  texts.push({x:v.x,y:v.y,t:'💥',life:1,col:'#fff',big:true});
  v.respawn=2.8;
  if(!v.bot){shake=12;beep(140,.4,'sawtooth',.06);
    document.getElementById('deadTxt').textContent=(k?k.name:'מישהו')+' הפיל אותך!';
    document.getElementById('dead').classList.remove('hidden');lastKiller=k?k.name:''}
  else if(k&&k.team===1){beep(880,.1,'square',.04);beep(1320,.15,'square',.04,.08);texts.push({x:v.x,y:v.y-1.5,t:'הפלת את '+v.name+'!',life:1.4,col:'#fff'})}
}
// a surrounded castle: that whole kingdom joins whoever took it
function join(v,lord){
  if(v.out)return;
  if(!v.bot){v.out=true;v.alive=false;document.getElementById('dead').classList.add('hidden');setTimeout(()=>endGame(lord),900);return}
  const old=v.team;
  for(const q of players)if(q.team===old){q.team=lord.team;q.hue=lord.hue;q.sat=lord.sat}
  for(let c=0;c<N;c++)if(owner[c]===old)owner[c]=lord.team;
  claimHome(v);

    ctx.fillStyle='#8f949c';rr(X+1,Y+1,CS-2,CS-3,4);ctx.fill();
    ctx.fillStyle='#b6bbc3';rr(X+2,Y+2,CS-4,6,3);ctx.fill();
    ctx.fillStyle=hsl(p,50);ctx.fillRect(X+3,Y+CS-6,CS-6,3);
    const dmg=WALLHP-wall[c];
    if(dmg>0){ctx.strokeStyle='#3d3f44';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(X+4,Y+3);ctx.lineTo(X+8,Y+8);if(dmg>1)ctx.lineTo(X+6,Y+12);if(dmg>2){ctx.moveTo(X+12,Y+3);ctx.lineTo(X+9,Y+9)}ctx.stroke()}}
  for(const p of players){for(let i=0;i<p.tl.length;i++){const c=p.tl[i],X=cx(c)*CS+CS/2,Y=cy(c)*CS+CS/2,w=Math.sin(time*12+i)*1.2;
    ctx.fillStyle=hsl(p,60,.35);ctx.fillRect(cx(c)*CS,cy(c)*CS,CS,CS);
    ctx.fillStyle='#8a5a2b';rr(X-2+w*.3,Y-6,4,12,1.5);ctx.fill();
    ctx.fillStyle=hsl(p,55);ctx.beginPath();ctx.moveTo(X-3+w*.3,Y-6);ctx.lineTo(X+w*.3,Y-10);ctx.lineTo(X+3+w*.3,Y-6);ctx.fill()}}
  for(const t of things){const X=t.x*CS+CS/2,Y=t.y*CS+CS/2,home=t.kind==='home',s=(home?1.5:t.big?1.6:1)*(1+t.pop*.5),p=t.own?players[t.own-1]:null;
    ctx.save();ctx.translate(X,Y);ctx.scale(s,s);
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(0,9,10,3,0,0,7);ctx.fill();
    if(home||t.big){ctx.fillStyle=home?'#efe4c8':'#d9cfb8';ctx.fillRect(-9,-4,18,13);ctx.fillRect(-11,-9,6,18);ctx.fillRect(5,-9,6,18);
      ctx.fillStyle=p?hsl(p,45):'#777';ctx.beginPath();ctx.moveTo(-12,-9);ctx.lineTo(-8,-15);ctx.lineTo(-4,-9);ctx.moveTo(4,-9);ctx.lineTo(8,-15);ctx.lineTo(12,-9);ctx.fill();
      ctx.fillStyle='#5b4632';rr(-3,2,6,7,3);ctx.fill();
      if(home){ctx.fillStyle=p?hsl(p,45):'#777';ctx.beginPath();ctx.moveTo(-3,-9);ctx.lineTo(0,-18);ctx.lineTo(3,-9);ctx.fill()}}
    else{ctx.fillStyle='#f3e6c8';ctx.fillRect(-6,-2,12,10);ctx.fillStyle=p?hsl(p,48):'#a0522d';ctx.beginPath();ctx.moveTo(-8,-1);ctx.lineTo(0,-9);ctx.lineTo(8,-1);ctx.fill();ctx.fillStyle='#6b4a2b';ctx.fillRect(-2,3,4,5)}
    if(p&&!home){const fy=t.big?-15:-9;ctx.strokeStyle='#444';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,fy);ctx.lineTo(0,fy-10);ctx.stroke();
      ctx.fillStyle=hsl(p,55);ctx.beginPath();const wv=Math.sin(time*6+t.x)*1.5;ctx.moveTo(0,fy-10);ctx.quadraticCurveTo(4,fy-11+wv,8,fy-8);ctx.lineTo(0,fy-6);ctx.fill()}
    else if(!p&&!songMode){ctx.font='bold 8px system-ui';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('+'+(t.big?150:40),0,-12)}
    ctx.restore()}
  const lead=lords().sort((a,b)=>points(b.team,scoreOf(b.team))-points(a.team,scoreOf(a.team)))[0];
  for(const p of players){if(!p.alive||p.out)continue;
    const X=p.x*CS,Y=p.y*CS,b=Math.sin(p.bob),hop=Math.abs(b)*3,sq=1+Math.abs(b)*.08;
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(X,Y+8,8-hop*.6,3,0,0,7);ctx.fill();
    ctx.save();ctx.translate(X,Y-hop);ctx.scale(p.face/sq,sq);
    if(p.dash>0){ctx.globalAlpha=.3;ctx.fillStyle=hsl(p,60);ctx.beginPath();ctx.arc(-6,0,8,0,7);ctx.fill();ctx.globalAlpha=1}
    ctx.fillStyle='#555';ctx.fillRect(-4,5+b*2,3,5);ctx.fillRect(1,5-b*2,3,5);
    ctx.fillStyle=hsl(p,52);ctx.beginPath();ctx.arc(0,1,8,0,7);ctx.fill();
    ctx.fillStyle=hsl(p,70);ctx.beginPath();ctx.arc(-2,-1,3,0,7);ctx.fill();
    ctx.fillStyle='#c8ccd3';ctx.beginPath();ctx.arc(0,-6,7,Math.PI,0);ctx.lineTo(7,-3);ctx.lineTo(-7,-3);ctx.fill();
    ctx.fillStyle='#2b2d33';ctx.fillRect(1,-6,6,2);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(4,-5,1.2,0,7);ctx.fill();
    ctx.fillStyle=hsl(p,55);ctx.beginPath();ctx.ellipse(-3,-14+Math.sin(time*10+p.id)*.8,5,2.5,-.5,0,7);ctx.fill();
    ctx.save();ctx.translate(7,1);ctx.rotate(p.brk>0?-1.4+p.brk*5:(.3+b*.3));ctx.fillStyle='#e5e8ee';ctx.fillRect(0,-12,2.5,12);ctx.fillStyle='#8a5a2b';ctx.fillRect(-2,-1,6.5,2.5);ctx.restore();
    ctx.restore();
    ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.55)';
    const nm=songMode?'':(lead&&p.id===lead.id?'👑 ':'')+p.name;ctx.strokeText(nm,X,Y-24);ctx.fillStyle=p.team===1&&p.id!==1?'#ffe066':'#fff';ctx.fillText(nm,X,Y-24);
    if(!p.bot){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(X,Y,13+Math.sin(time*5)*1.5,0,7);ctx.stroke()}
  }
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.col;if(q.conf){ctx.fillRect(q.x*CS,q.y*CS,q.s*1.5,q.s)}else{ctx.beginPath();ctx.arc(q.x*CS,q.y*CS,q.s,0,7);ctx.fill()}}
  ctx.globalAlpha=1;
  for(const t of texts){if(songMode)break;const a=Math.min(1,t.life*2);ctx.globalAlpha=a;ctx.font=`900 ${t.big?28:18}px system-ui`;ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(t.t,t.x*CS,t.y*CS);ctx.fillStyle=t.col;ctx.fillText(t.t,t.x*CS,t.y*CS)}
  ctx.globalAlpha=1;
  ctx.restore();
}

// ---------- HUD ----------
let hudT=0;
function standings(){return lords().map(p=>{const c=scoreOf(p.team);return{p,c,pts:points(p.team,c),allies:players.filter(q=>q.team===p.team&&q!==p).length}}).sort((a,b)=>b.pts-a.pts)}
function hud(dt){hudT-=dt;if(hudT>0)return;hudT=.25;
  const rows=standings();
  document.getElementById('lb').innerHTML='<b>🏆 מלכי הממלכה</b><br>'+rows.map((r,i)=>`<span style="color:${hsl(r.p,75)}">${i+1}. ${r.p.name}${r.allies?' +'+r.allies:''}</span> · ${r.pts}`).join('<br>');
  const m=rows.find(r=>r.p.id===1);if(!m)return;
  document.getElementById('me').innerHTML=`🗺️ ${(m.c/N*100).toFixed(1)}% מהממלכה<br>⭐ ${m.pts} נקודות<br>👑 הצטרפו אליך: ${m.allies}<br>${me().dashCd>0?'💨 דהירה נטענת':'💨 דהירה מוכנה (רווח)'}`;
  const s=Math.max(0,Math.ceil(left));document.getElementById('timer').textContent=`⏳ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

// ---------- flow ----------
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1800)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('הועתק! הדבק בווטסאפ 📲'),()=>toast(t))}
let endText='';
function endGame(byKiller,world){if(!running)return;running=false;
  const passed=!songMode&&!autoFilm&&!me().out&&(world||scoreOf(1)/N*100>=L().goal);const was=lvl;if(passed&&lvl<LEVELS.length-1){lvl++;try{localStorage.setItem('walls_lvl',lvl)}catch(e){}}setTimeout(()=>{const t=document.getElementById('endTitle');if(!t)return;if(passed)t.textContent=was===LEVELS.length-1?'👑 כבשת את העולם!':`✅ שלב ${was+1} הושלם! הבא: ${L().name}`;else if(!songMode&&!autoFilm)t.textContent=`❌ צריך ${L().goal}% כדי לעבור את ${L().name}`;showLevel()},0);
  ['lb','me','timer'].forEach(i=>document.getElementById(i).classList.add('hidden'));
  document.getElementById('dead').classList.add('hidden');
  const rows=standings(),out=me().out,rank=out?rows.length+1:rows.findIndex(r=>r.p.id===1)+1,m=rows.find(r=>r.p.id===1),pct=m?(m.c/N*100).toFixed(1):'0';
  document.getElementById('endTitle').textContent=world?'👑 כבשת את כל הממלכה!':out?'💀 הטירה שלך נכבשה':rank===1?'👑 אתה המלך!':rank<=3?'🥈 כמעט מלך!':'⚔️ הקרב נגמר';
  document.getElementById('endTxt').innerHTML=out?`${byKiller?byKiller.name+' הקיף לך את הטירה':''}`:`כבשת ${pct}% מהממלכה · מקום ${rank}${m&&m.allies?`<br>${m.allies} ממלכות הצטרפו אליך`:''}`;
  endText=`🏰 כבשתי ${pct}% מהממלכה במשחק "חומות"! חושב שתנצח אותי? ⚔️`;
  document.getElementById('end').classList.remove('hidden');
  showClips();setTimeout(showClips,2500);
}
function start(){try{ac=ac||new AudioContext();ac.resume()}catch(e){}
  init();['start','end','dead'].forEach(i=>document.getElementById(i).classList.add('hidden'));
  ['lb','me','timer'].forEach(i=>document.getElementById(i).classList.remove('hidden'));
  for(const r of recs){try{r.mr.stop()}catch(e){}}recs=[];clips=[];lastHL=-9;
  running=true;time=0;hudT=0;beep(523,.1,'triangle',.05);beep(784,.15,'triangle',.05,.1)}
document.getElementById('go').onclick=()=>{autoFilm=false;start()};
document.getElementById('insane').onclick=()=>{scene();toast('🎬 מצלם מהלך מטורף...')};
document.getElementById('film').onclick=()=>{autoFilm=true;start();toast('🎬 מצב צילום: האביר משחק לבד, וכל רגע ויראלי נשמר')};
document.getElementById('again').onclick=()=>start();
document.getElementById('share').onclick=()=>copy(endText);
document.getElementById('revenge').onclick=()=>copy(`😤 ${lastKiller} הפיל אותי במשחק "חומות"! בוא תעזור לי לנקום בו ⚔️`);

init();showLevel();
let last=0;
let manualStep=false;
function loop(t){requestAnimationFrame(loop);if(manualStep)return;followCam();try{sceneTick();let dt=Math.min(.05,(t-last)/1000||0);last=t;if(slow>0){slow-=dt;dt*=.35}if(running)update(dt);fx(dt);draw();drawRec();recTick();if(running)hud(dt)}catch(e){console.error(e)}}
requestAnimationFrame(loop);
</script>
<script>
// Match recorder: while you play, keeps a compact log of every frame (knight positions + map changes)
// and every highlight the game detects, so the match can be re-rendered later in HD around its best moment.
(() => {
  if (location.search.includes('hq')) return;
  const R = { on: false, frames: [], hl: [], prev: null, head: null };
  const snap = () => {
    if (!R.prev) R.prev = { o: new Int8Array(N), tr: new Int8Array(N), w: new Int8Array(N) };
    const o = [], tr = [], w = [];
    for (let c = 0; c < N; c++) {
      if (owner[c] !== R.prev.o[c]) { o.push(c, owner[c]); R.prev.o[c] = owner[c] }
      if (trail[c] !== R.prev.tr[c]) { tr.push(c, trail[c]); R.prev.tr[c] = trail[c] }
      if (wall[c] !== R.prev.w[c]) { w.push(c, wall[c]); R.prev.w[c] = wall[c] }
    }
    R.frames.push({
      t: +time.toFixed(3),
      p: players.map(p => [+p.x.toFixed(2), +p.y.toFixed(2), p.alive ? 1 : 0, p.out ? 1 : 0, p.face, +p.bob.toFixed(2), p.team, p.hue, p.sat, p.dash > 0 ? 1 : 0, p.brk > 0 ? 1 : 0]),
      o, tr, w, th: things.map(t => t.own),
    });
  };
  const _start = start;
  start = function () {
    _start.apply(this, arguments);
    R.on = !autoFilm; R.frames = []; R.hl = []; R.prev = null;
    R.head = { names: players.map(p => p.name), homes: players.map(p => [p.hx, p.hy]), things: things.map(t => ({ x: t.x, y: t.y, kind: t.kind || '', homeOf: t.homeOf || 0, big: !!t.big })) };
  };
  const _update = update;
  update = function (dt) { _update(dt); if (R.on && running) snap() };
  const _hl = highlight;
  highlight = function (k) { if (R.on) R.hl.push({ k, i: R.frames.length, t: +time.toFixed(2) }); return _hl(k) };
  const _end = endGame;
  endGame = function () {
    const wasOn = R.on; R.on = false; _end.apply(this, arguments);
    if (!wasOn || !R.frames.length) return;
    const el = document.getElementById('clips');
    if (!el) return;
    const b = document.createElement('button');
    b.style.cssText = 'display:block;margin:8px auto;font-size:17px;background:#2b6cb0;color:#fff;box-shadow:0 4px 0 #1a4a80';
    b.textContent = `🎬 שמור את המשחק לעריכה (${R.hl.length} רגעים)`;
    b.onclick = async () => {
      const data = JSON.stringify({ v: 1, head: R.head, hl: R.hl, frames: R.frames });
      const name = 'walls-match-' + Date.now() + '.json';
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl) { try { await dl.save({ filename: name, data }); b.textContent = '✅ נשמר' } catch (e) { b.textContent = '⚠️ לא נשמר' } }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); b.textContent = '✅ נשמר' }
    };
    setTimeout(() => el.prepend(b), 2600);
  };
  window.__REC = R;
})();
</script>
